<h3>Seleccionar estudio</h3>
<form
  class="row needs-validation study-order-grid"
  id="form-horarios"
  novalidate
>
  <div class="col-lg-6">
    <div class="study-card">
      <h4>Radiografía extraoral</h4>
      <div class="row">
        <div class="col-md-6">
          <label class="study-option"
            ><input class="form-check-input" type="checkbox" />
            Panorámica</label
          >
          <label class="study-option"
            ><input class="form-check-input" type="checkbox" /> Panorámica + 3
            periapicales</label
          >
          <label class="study-option"
            ><input class="form-check-input" type="checkbox" /> Lateral de
            cráneo</label
          >
          <label class="study-option"
            ><input class="form-check-input" type="checkbox" /> ATM</label
          >
          <label class="study-option"
            ><input class="form-check-input" type="checkbox" /> Carpal</label
          >
        </div>
        <div class="col-md-6">
          <label class="study-option"
            ><input class="form-check-input" type="checkbox" /> Frontal
            <h3>Seleccionar horario de cita</h3>
            <form class="row needs-validation" id="form-horarios" novalidate>
              <div class="col-md-6">
                <select
                  id="select-hora"
                  class="form-select text-center"
                  aria-label="Seleccionar hora"
                >
                  <option disabled selected>-- Hora --</option>
                  <option value="9">9</option>
                  <option value="10">10</option>
                  <option value="11">11</option>
                  <option value="12">12</option>
                  <option value="13">13</option>
                  <option value="14" class="to-disable">14</option>
                  <option value="15" class="to-disable">15</option>
                  <option value="16" class="to-disable">16</option>
                  <option value="17" class="to-disable">17</option>
                  <option value="18" class="to-disable">18</option>
                </select>
              </div>
              <div class="col-md-6">
                <select
                  id="select-minutos"
                  class="form-select text-center"
                  aria-label="Seleccionar minutos"
                >
                  <option disabled selected>-- Minutos --</option>
                  <option value="00">00</option>
                  <option value="15">15</option>
                  <option value="30">30</option>
                  <option value="45">45</option>
                </select>
              </div>
              <div class="col-md-12">
                <div class="data">
                  <div>Su cita sera programada para el dia</div>
                  <div class="cita-fecha">
                    <strong
                      ><span id="cita-fecha-label">12-24-2020</span></strong
                    >
                  </div>
                  <div>
                    a las <span id="cita-hora"></span>:
                    <span id="cita-minutos"></span> hrs.
                  </div>
                </div>
              </div>
            </form>
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >44</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >43</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >42</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >41</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >31</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >32</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >33</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >34</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >35</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >36</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >37</span
            ></label
          >
          <label class="tooth-item"
            ><input class="form-check-input diente" type="checkbox" /><span
              >38</span
            ></label
          >
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="study-card">
      <h4>Tomografía</h4>
      <label class="study-option"
        ><input class="form-check-input" type="checkbox" /> Completa</label
      >
      <label class="study-option"
        ><input class="form-check-input" type="checkbox" /> Arcada
        superior</label
      >
      <label class="study-option"
        ><input class="form-check-input" type="checkbox" /> Arcada
        inferior</label
      >
      <label class="study-option"
        ><input class="form-check-input" type="checkbox" /> Cuadrante. Marque
        cuadrante requerido:</label
      >
      <div class="quadrant-options">
        <label class="study-option-inline"
          ><input class="form-check-input" type="checkbox" /> I</label
        >
        <label class="study-option-inline"
          ><input class="form-check-input" type="checkbox" /> II</label
        >
        <label class="study-option-inline"
          ><input class="form-check-input" type="checkbox" /> III</label
        >
        <label class="study-option-inline"
          ><input class="form-check-input" type="checkbox" /> IV</label
        >
      </div>
      <label class="study-option mt-2"
        ><input class="form-check-input" type="checkbox" /> Estudio endodóntico
        3D (Endoscan)</label
      >
      <div class="study-inline-field">
        <span>Pieza:</span>
        <input class="study-text-input" type="text" />
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="study-card">
      <h4>Fotografía clínica</h4>
      <div class="row">
        <div class="col-md-4">
          <label class="study-option"
            ><input class="form-check-input" type="checkbox" /> Foto
            intraoral</label
          >
        </div>
        <div class="col-md-4">
          <label class="study-option"
            ><input class="form-check-input" type="checkbox" /> Foto
            extraoral</label
          >
        </div>
        <div class="col-md-4">
          <label class="study-option"
            ><input class="form-check-input" type="checkbox" /> Análisis
            facial</label
          >
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="study-card">
      <h4>Observaciones</h4>
      <textarea class="study-notes" rows="4"></textarea>
    </div>
  </div>
</form>
